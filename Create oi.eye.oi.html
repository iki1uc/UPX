}
.leading-tight{
  line-height: 1.25;
}
.tracking-\[0\.22em\]{
  letter-spacing: 0.22em;
}
.tracking-\[0\.25em\]{
  letter-spacing: 0.25em;
}
.tracking-\[0\.2em\]{
  letter-spacing: 0.2em;
}
.tracking-\[0\.3em\]{
  letter-spacing: 0.3em;
}
.tracking-tight{
  letter-spacing: -0.025em;
}
.tracking-widest{
  letter-spacing: 0.1em;
}
.text-\[var\(--cyan\)\]{
  color: var(--cyan);
}
.text-\[var\(--gold\)\]{
  color: var(--gold);
}
.text-\[var\(--ink\)\]{
  color: var(--ink);
}
.text-\[var\(--muted\)\]{
  color: var(--muted);
}
.text-\[var\(--red\)\]{
  color: var(--red);
}
.opacity-60{
  opacity: 0.6;
}
.opacity-\[0\.13\]{
  opacity: 0.13;
}
.shadow-\[0_0_24px_rgba\(255\2c 204\2c 68\2c 0\.35\)\]{
  --tw-shadow: 0 0 24px rgba(255,204,68,0.35);

}
.ring{
  --tw-ring-offset-shadow: var(--tw-ring-inset) 0 0 0 var(--tw-ring-offset-width) var(--tw-ring-offset-color);
  --tw-ring-shadow: var(--tw-ring-inset) 0 0 0 calc(3px + var(--tw-ring-offset-width)) var(--tw-ring-color);

:root{
  --surface:#05070a;
  --surface-2:#0a0f16;
  --ink:#e8f0f2;
  --muted:#8a9aa3;
  --gold:#ffcc44;
  --cyan:#22e6ff;
  --red:#ff5a4d;
  --line:#1c2a33;
}
@media (prefers-color-scheme: dark){
  :root{
    --surface:#05070a;
    --surface-2:#0a0f16;
    --ink:#e8f0f2;
    --muted:#8a9aa3;
    --gold:#ffcc44;
    --cyan:#22e6ff;
    --red:#ff5a4d;
    --line:#1c2a33;
  }
}
html,body{
  background:var(--surface);
}
body{
  font-family:'JetBrains Mono', ui-monospace, monospace;
}
.scanlines{
  background-image: repeating-linear-gradient(to bottom, rgba(255,255,255,0.035) 0px, rgba(255,255,255,0.035) 1px, transparent 1px, transparent 4px);
}
@keyframes spinSlow{
  from{
    transform:rotate(0deg);
  }
  to{
    transform:rotate(360deg);
  }
}
@keyframes fallFeather{
  0%{
    transform: translateY(0) rotate(0deg);
    opacity:1;
  }
  80%{
    opacity:1;
  }
  100%{
    transform: translateY(180px) rotate(70deg);
    opacity:0;
  }
}
@keyframes pulseGold{
  0%,100%{
    opacity:.35;
  }
  50%{
    opacity:1;
  }
}
@keyframes dashMove{
  to{
    stroke-dashoffset:-40;
  }
}
.animate-spin-slower{
  animation: spinSlow 60s linear infinite;
}
.falling-feather{
  animation: fallFeather 3.2s ease-in forwards;
}
.pulse-gold{
  animation: pulseGold 2s ease-in-out infinite;
}
.loop-dash{
  animation: dashMove 3s linear infinite;
}
.hover\:border-\[var\(--cyan\)\]:hover{
  border-color: var(--cyan);
}
.hover\:border-\[var\(--gold\)\]:hover{
  border-color: var(--gold);
}
.disabled\:opacity-50:disabled{
  opacity: 0.5;
}
@media (min-width: 640px){
  .sm\:w-44{
    width: 11rem;
  }
  .sm\:text-5xl{
    font-size: 3rem;
    line-height: 1;
  }
}
